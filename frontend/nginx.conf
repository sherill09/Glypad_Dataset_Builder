# Serves the built React app, and forwards anything under /api to the
# backend container. Both the page and the API calls it makes look like
# they come from the same origin (your one domain) — the browser never
# needs to know the backend has its own separate address inside Docker.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # This is a "single-page app": there's really only one HTML file, and
    # the React Router library decides what to show based on the URL
    # (e.g. /files/abc123). Without this line, refreshing the browser on
    # a page like that would 404, because nginx would look for a real
    # file at that path and not find one. Falling back to index.html lets
    # React Router take over and render the right page itself.
    location / {
        try_files $uri /index.html;
    }

    # "backend" here is the other container's *service name* in
    # docker-compose.prod.yml — Docker's internal network resolves that
    # name to the right container automatically, the way a real DNS name
    # would.
    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Uploads can be large CAD files — match the backend's own
        # MAX_UPLOAD_MB so nginx doesn't reject a file the API would have
        # happily accepted. Raise both together if you need bigger files.
        client_max_body_size 200M;
    }
}
